<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>페이지를 찾을 수 없습니다 — MotionFrame</title>
  <meta name="robots" content="noindex" />
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;color:#162038;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;padding:24px}.card{width:min(560px,100%);border:1px solid #dfe4ee;border-radius:24px;background:#fff;padding:38px;box-shadow:0 24px 70px rgba(31,44,78,.12)}.mark{width:42px;height:42px;border-radius:12px;background:#10182c;position:relative}.mark:after{content:"";position:absolute;left:10px;top:10px;width:21px;height:14px;border:3px solid #fff;border-radius:4px;box-shadow:8px 8px 0 -1px #10182c,8px 8px 0 2px #8098ff}h1{margin:24px 0 0;font-size:34px;letter-spacing:-.045em}p{color:#6f7b93;line-height:1.75;font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}a,button{min-height:44px;border-radius:11px;padding:10px 16px;font:inherit;font-size:14px;font-weight:750;cursor:pointer;text-decoration:none}a{display:inline-flex;align-items:center;background:#315dff;color:#fff;border:1px solid #315dff}button{border:1px solid #cbd3e3;background:#fff;color:#162038}@media(max-width:500px){.card{padding:28px 22px}.actions{display:grid}.actions>*{width:100%;justify-content:center}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>페이지를 찾을 수 없습니다.</h1>
    <p>주소가 바뀌었거나 존재하지 않는 경로입니다. MotionFrame 편집기로 돌아가 프로젝트를 계속 작업할 수 있습니다.</p>
    <div class="actions"><a href="./">편집기로 이동</a><button type="button" onclick="history.back()">이전 페이지</button></div>
  </main>
</body>
</html>
